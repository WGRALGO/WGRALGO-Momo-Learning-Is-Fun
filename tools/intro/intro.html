<!doctype html>
<html><head><meta charset="utf-8"><title>Momo intro frames</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="momo-light.js"></script>
<script>
// Draws one frame of the public intro at time t (seconds): Momo's heart pulsing with her words in the middle, the
// 8 characters popping in around her one by one, and all 8 bouncing at "choose your character".
// tools/make_intro.py fills window.INTRO = { env: {fps, v}, lead, pops: [s...], choose: s, begin: s, chars: [img urls] }.
(function () {
  var W = 1920, H = 1080, CX = W / 2, CY = H / 2, c = document.getElementById('c'), g = c.getContext('2d');
  var I = window.INTRO, imgs = [];
  var media = { currentTime: 0, paused: true, ended: false };
  var light = new MomoLight(c, 'heart', { manual: true, background: false,
    layout: function () { return { cx: CX, cy: CY, R0: 150 }; } });
  light.setSize(W, H, 1);
  light.follow(media, I.env);
  // 8 places on an ellipse around the heart, clockwise from the top
  var S = 250, spots = [];
  for (var i = 0; i < 8; i++) {
    var a = -Math.PI / 2 + i * Math.PI / 4;
    spots.push({ x: CX + Math.cos(a) * 690, y: CY + Math.sin(a) * 372 });
  }
  // the night sky of the app: purple glow + soft sparkles that twinkle
  var stars = [];
  for (var k = 0; k < 90; k++) stars.push({ x: (k * 977) % W, y: (k * 613 + 71) % H, r: 1.2 + (k % 5) * 0.5, p: k * 0.7,
    col: ['255,255,255', '247,183,51', '244,126,192'][k % 3] });
  function sky(t) {
    var gr = g.createRadialGradient(CX, -0.1 * H, 50, CX, CY, H * 1.15);
    gr.addColorStop(0, '#7330b4'); gr.addColorStop(0.45, '#542282'); gr.addColorStop(0.8, '#3d1468'); gr.addColorStop(1, '#2c0d52');
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.fillStyle = gr; g.fillRect(0, 0, W, H);
    stars.forEach(function (s) {
      var a = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 1.7 + s.p));
      g.fillStyle = 'rgba(' + s.col + ',' + a.toFixed(3) + ')'; g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI * 2); g.fill();
    });
  }
  function ease(p) { return 1 - Math.pow(1 - p, 3); }
  function pop(p) {            // 0 → overshoot 1.12 → 1
    if (p <= 0) return 0; if (p >= 1) return 1;
    return p < 0.6 ? 1.12 * ease(p / 0.6) : 1.12 - 0.12 * ease((p - 0.6) / 0.4);
  }
  function rrect(x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function card(i, t) {
    var p = (t - I.pops[i]) / 0.5; if (p <= 0) return;
    var s = pop(p), sp = spots[i];
    var bob = Math.sin(t * 1.3 + i * 0.8) * 5;
    // "choose your character": every card bounces, one after another, twice
    var b = 0;
    [I.choose, I.begin].forEach(function (t0, n) {
      var q = (t - t0 - i * 0.07) / 0.55;
      if (q > 0 && q < 1) b = Math.max(b, Math.sin(q * Math.PI) * (n ? 0.06 : 0.12));
    });
    var tilt = b ? Math.sin((t - I.choose) * 18 + i) * 0.04 * (b / 0.12) : 0;
    var size = S * s * (1 + b);
    g.save();
    g.translate(sp.x, sp.y + bob - b * 40); g.rotate(tilt);
    g.globalAlpha = Math.min(1, p * 2);
    g.shadowColor = 'rgba(20,0,40,.5)'; g.shadowBlur = 26; g.shadowOffsetY = 10;
    rrect(-size / 2 - 11, -size / 2 - 11, size + 22, size + 22, 40); g.fillStyle = 'rgba(255,255,255,.22)'; g.fill();
    g.shadowColor = 'transparent';
    rrect(-size / 2 - 7, -size / 2 - 7, size + 14, size + 14, 36); g.fillStyle = '#f7b733'; g.fill();
    rrect(-size / 2, -size / 2, size, size, 30); g.save(); g.clip(); g.drawImage(imgs[i], -size / 2, -size / 2, size, size); g.restore();
    g.restore();
  }
  window.drawFrame = function (t) {
    var at = t - I.lead;
    media.currentTime = Math.max(0, at); media.paused = at < 0 || at > I.env.v.length / I.env.fps; media.ended = false;
    sky(t);
    light.draw(t * 1000);
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    for (var i = 0; i < 8; i++) card(i, t);
  };
  window.ready = Promise.all(I.chars.map(function (src, i) {
    return new Promise(function (res, rej) { var im = new Image(); im.onload = function () { imgs[i] = im; res(); }; im.onerror = rej; im.src = src; });
  }));
})();
</script></body></html>
